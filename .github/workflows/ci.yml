# CI for the parts of Spyglass that run without Docker, a model key or the
# TrueForge harness: the Rust workspace (fmt, clippy, tests), the scenario
# ground truth against its schema, the Python tooling, and a check that the
# generated benchmark tables match the committed run files.
#
# Not in CI, deliberately: the S1 smoke (`just scenario s1` + an agent run)
# needs Docker Compose, the harness on :8790 and a paid model key — it is
# run by hand (`just demo`) and its results are committed under
# bench/results/. See docs/phase11-findings.md.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  scenarios-and-tooling:
    name: ground truth, python tooling, report consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: python compiles
        run: python3 -m py_compile scripts/*.py bench/*.py target-system/*/*.py
      - name: ground truth validates against scenarios/SCHEMA.md
        run: python3 scripts/validate-ground-truth.py scenarios/*/ground-truth.yaml
      - name: generated tables match the committed run files
        # bench/report.py rewrites the generated regions of docs/benchmark.md and
        # README.md from bench/results/*.json; a diff means a table was hand-edited
        # or a run file was committed without `just report`. The report stamps its
        # own generation time, so that one line is ignored -- everything else must
        # reproduce byte-for-byte from the committed runs.
        run: |
          python3 bench/report.py
          git diff --exit-code -I'^\*Generated by `bench/report\.py`' -- docs/benchmark.md README.md
