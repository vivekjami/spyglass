[package]
name = "spyglass-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spyglass evidence engine as a read-only MCP server (streamable HTTP)"

[[bin]]
name = "spyglass-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono = { workspace = true, features = ["serde"] }
clap.workspace = true
rmcp.workspace = true
serde_json.workspace = true
spyglass-core = { path = "../spyglass-core" }
spyglass-engine = { path = "../spyglass-engine" }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
