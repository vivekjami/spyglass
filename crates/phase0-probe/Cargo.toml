# Throwaway Phase 0 validation binary, NOT the Spyglass engine.
# It exists to prove two things before any real engine code is written:
#   1. a Rust `rmcp` streamable-HTTP server is reachable and invocable from a
#      TrueForge session (Phase 0 item 2);
#   2. `require_approval_for_tools` actually gates a mutating tool, and the
#      approval can be granted programmatically (Phase 0 item 5).
# Delete once crates/spyglass-mcp exists.

