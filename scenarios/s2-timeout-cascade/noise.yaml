# S2 noise profile. Same seeded traffic and background chatter as S1
# (scenarios/s1-payment-regression/noise.yaml); what differs is the decoy.
seed: 42
rate_rps: 10
payload_mix:
  currency: {USD: 80, EUR: 12, GBP: 5, JPY: 3}
  card_class: {standard: 70, premium: 20, corporate: 10}   # premium+corporate = the ~30% v2 deep-scores
  amount: lognormal(mu=3.5, sigma=0.6)
background:
  malformed_request_rate: 0.02
  injection_user_agent_rate: 0.01
  warn_chatter:
    orders_pg_slow_rate: 0.03
    gateway_slow_rate: 0.02
    payments_cache_hiccup_rate: 0.02     # ERROR "cache write failed: TimeoutError" (retried, ok)
  fraud_vendor_v1_latency_ms: 3
decoy:
  latency_blip: {service: gateway, blip_ms: 400, blip_share: 0.5, duration_secs: 30, lead_secs_before_fault: 180}
fault:
  config_release: {service: orders, version: v1.2, fraud_endpoint: /v2/score, fraud_timeout_ms: 10000}
  vendor_v2_latency_ms: {standard: 1500, premium: 9000, corporate: 9000}
  gateway_upstream_timeout_ms: 8000
